// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    //ext.kotlin_version = '2.0.20' //version funcional, pero warnings en kapt.
    //ext.kotlin_version = '1.9.22'

    repositories {
        google()
        mavenCentral()
        //gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48'
    }
}

plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'com.google.dagger.hilt.android' version '2.58' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
    id 'com.google.devtools.ksp' version '2.2.21-2.0.5' apply false

    // Analizar Composables
    id 'com.github.skydoves.compose.stability.analyzer' version '0.6.5+' apply false

    // Roborazzi
    id("io.github.takahirom.roborazzi") version "1.44.0" apply false

    // Kover
    id "org.jetbrains.kotlinx.kover" version "0.7.6" apply false
}

//apply plugin: 'org.jetbrains.kotlinx.kover'